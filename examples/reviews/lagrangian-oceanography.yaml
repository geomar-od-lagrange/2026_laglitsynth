# Per-review config for scripts/run-pipeline.sh.
#
# This file carries the runner's smoke-run defaults; it is the config
# `scripts/run-pipeline.sh` reads when given no argument. The screening
# threshold, the LLM endpoint and the models have no default: set them
# below or export SCREENING_THRESHOLD, LLM_BASE_URL and *_MODEL before
# running. The API key never goes here: it is LLM_API_KEY in .env. Validated against the `ReviewConfig`
# model and emitted as CFG_* shell assignments by
# `laglitsynth review-config`. See docs/configs.md.
#
# Only the knobs a review actually pins are set here; an omitted
# concurrency falls back to the runner's built-in default. Env vars still
# override everything (env > config > default).

query: "Lagrangian particle tracking"

# Smoke-sized cap. For a real corpus run, raise this (e.g. 500) or
# override on the command line with `N=500 scripts/run-pipeline.sh`.
max_records: 5

# Criteria/codebook paths resolve relative to THIS file's directory.
screening_criteria: ../screening-criteria/lagrangian-oceanography.yaml
eligibility_criteria: ../eligibility-criteria/lagrangian-oceanography.yaml
codebook: ../codebooks/lagrangian-oceanography.yaml

# Optional knobs — uncomment to pin (otherwise the runner default wins):
#
# from_year: 2000
# to_year: 2025
# screening_threshold: <0-100>   # corpus-assemble's relevance-score cutoff (required from stage 5 on)
# llm_base_url: <https://.../v1>  # OpenAI-compatible base (required from stage 3 on)
# llm_decisions_url: <url>        # only if decisions are not at <llm_base_url>/decisions
# models:                         # required for each stage the run reaches
#   screening: <decisions model>
#   eligibility: <decisions model>
#   extraction: <chat model>
#   extraction_reasoning_effort: <low|medium|high>  # unset: provider default
# concurrency:
#   llm: 1
#   extraction: 1
#   grobid: 3                     # in-flight GROBID requests at stage 6
