id: lagrangian-oceanography
description: |
  Inclusion criteria for a systematic review of numerical methods in
  computational Lagrangian oceanography. Used by stage-7 full-text
  eligibility as the predicate question sent to the decisions endpoint,
  with the paper's rendered full text as input.
decision:
  instructions: >-
    Does this paper meet the inclusion criteria of a systematic review of
    numerical methods in Lagrangian oceanography? Both criteria must hold:
    (1) the paper describes a computation that tracks particles, tracers or
    objects in an ocean flow field; (2) the paper is primary research.
  criteria:
    "true": >-
      The paper describes a computation that tracks particles, tracers or
      objects in an ocean flow field, and it is primary research.
    "false": >-
      The paper does not track particles, tracers or objects in an ocean
      flow field, or it is a review, editorial or commentary rather than
      primary research.
